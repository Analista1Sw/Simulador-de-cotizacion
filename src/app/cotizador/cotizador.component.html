<div class="p-m-5">
  <div class="header-container p-d-flex p-ai-center p-mb-3">
    <!-- <img
      [src]="'images/Final03.png'"
      width="100"
      height="100"
      class="logo p-mr-3"
      alt="Logo"
    /> -->
    <h1 class="text-center p-m-0" style="font-size: 1.8em; color: #333">
      Simulador de Remodelación de Apartamentos
    </h1>
  </div>

  <p-tabView>
    <p-tabPanel header="🏠 Privadas y Sociales">
      <div class="p-fluid">
        <h3>Privadas y Sociales</h3>
        <div class="field">
          <label for="muro">Muro</label>
          <p-dropdown
            id="muro"
            [options]="materialesMuro"
            [(ngModel)]="selectedMaterialMuroHabitacion"
            placeholder="Selecciona material para muro"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="piso">Piso</label>
          <p-dropdown
            id="piso"
            [options]="materialesPiso"
            [(ngModel)]="selectedMaterialPisoHabitacion"
            placeholder="Selecciona material para piso"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="techo">Techo</label>
          <p-dropdown
            id="techo"
            [options]="materialesTecho"
            [(ngModel)]="selectedMaterialTechoHabitacion"
            placeholder="Selecciona material para techo"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="techo">Guarda Escoba</label>
          <p-dropdown
            id="guardaEscoba"
            [options]="materialesGuardaEscoba"
            [(ngModel)]="selectedMaterialGuardaEscoba"
            placeholder="Selecciona material para guarda escoba"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
      </div>
    </p-tabPanel>

    <!-- Tab Baño -->
    <p-tabPanel header="🚿 Baño">
      <div class="p-fluid">
        <h3>Baño</h3>
        <div class="field">
          <label for="muro">Muro</label>
          <p-dropdown
            id="muro"
            [options]="materialesMuro"
            [(ngModel)]="selectedMaterialMuroBa"
            placeholder="Selecciona material para muro"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="piso">Piso</label>
          <p-dropdown
            id="piso"
            [options]="materialesPiso"
            [(ngModel)]="selectedMaterialPisoBa"
            placeholder="Selecciona material para piso"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="techo">Techo</label>
          <p-dropdown
            id="techo"
            [options]="materialesTecho"
            [(ngModel)]="selectedMaterialTechoBa"
            placeholder="Selecciona material para techo"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="cabina">Cabina</label>
          <p-dropdown
            id="cabina"
            [options]="materialesCabina"
            [(ngModel)]="selectedCabina"
            placeholder="Selecciona una cabina"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
      </div>
    </p-tabPanel>
    <!-- Tab Cocina -->
    <p-tabPanel header="🍳 Cocina">
      <div class="p-fluid">
        <h3>Cocina</h3>
        <div class="field">
          <label for="muro">Muro</label>
          <p-dropdown
            id="muro"
            [options]="materialesMuro"
            [(ngModel)]="selectedMaterialMuroCocina"
            placeholder="Selecciona material para muro"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="piso">Piso</label>
          <p-dropdown
            id="piso"
            [options]="materialesPiso"
            [(ngModel)]="selectedMaterialPisoCocina"
            placeholder="Selecciona material para piso"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="techo">Techo</label>
          <p-dropdown
            id="techo"
            [options]="materialesTecho"
            [(ngModel)]="selectedMaterialTechoCocina"
            placeholder="Selecciona material para techo"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="techo">Guarda Escoba</label>
          <p-dropdown
            id="guardaEscoba"
            [options]="materialesGuardaEscoba"
            [(ngModel)]="selectedMaterialGuardaEscoba"
            placeholder="Selecciona material para guarda escoba"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="salpicader">Salpicadero</label>
          <p-dropdown
            id="salpicadero"
            [options]="materialesSalpicadero"
            [(ngModel)]="selectedMaterialSalpicadero"
            placeholder="Selecciona material para salpicadero"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
      </div>
    </p-tabPanel>
    <!-- Tab Lavado -->
    <p-tabPanel header="🧺 Lavado">
      <div class="p-fluid">
        <h3>Lavado</h3>
        <div class="field">
          <label for="muro">Muro</label>
          <p-dropdown
            id="muro"
            [options]="materialesMuro"
            [(ngModel)]="selectedMaterialMuroLavado"
            placeholder="Selecciona material para muro"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="piso">Piso</label>
          <p-dropdown
            id="piso"
            [options]="materialesPiso"
            [(ngModel)]="selectedMaterialPisoLavado"
            placeholder="Selecciona material para piso"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="techo">Techo</label>
          <p-dropdown
            id="techo"
            [options]="materialesTecho"
            [(ngModel)]="selectedMaterialTechoLavado"
            placeholder="Selecciona material para techo"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="guardaEscoba">Guarda Escoba</label>
          <p-dropdown
            id="guardaEscoba"
            [options]="materialesGuardaEscoba"
            [(ngModel)]="selectedMaterialGuardaEscobaLavado"
            placeholder="Selecciona material para guarda escoba"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
        <div class="field">
          <label for="salpicader">Salpicadero</label>
          <p-dropdown
            id="salpicadero"
            [options]="materialesSalpicadero"
            [(ngModel)]="selectedMaterialSalpicaderoLavado"
            placeholder="Selecciona material para salpicadero"
            optionLabel="tipoProducto"
          ></p-dropdown>
        </div>
      </div>
    </p-tabPanel>

    <p-tabPanel header="📋 Carpinteria y Accesorios">
      <div class="p-fluid">
        <h3>Materiales por Zona</h3>
        <p-table
          [value]="accesorios"
          [paginator]="true"
          [rows]="10"
          [resizableColumns]="true"
          [responsiveLayout]="'scroll'"
        >
          <ng-template pTemplate="header">
            <tr>
              <th>Nombre del Producto</th>
              <th>Cantidad</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-material>
            <tr>
              <td>{{ material.tipoProducto }}</td> <!-- Mostrar nombre del producto -->
              <td>
                <p-inputNumber
                  [(ngModel)]="material.cantidad"
                  [min]="0"
                  [showButtons]="true"
                  [placeholder]="'Cantidad'"
                  styleClass="w-full"
                >
                </p-inputNumber>
              </td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </p-tabPanel>
    
  </p-tabView>

  <div class="p-d-flex p-jc-center p-mt-4">
    <p-button
      label="Generar Cotización"
      (click)="showConfirmationDialog()"
    ></p-button>
  </div>
  <!-- Componente de Dialogo -->
  <p-dialog
    header="Confirmar Cotización"
    [(visible)]="displayModal"
    [modal]="true"
    [closable]="false"
    [style]="{ width: '400px' }"
  >
    <p>¿Estás seguro de que deseas generar la cotización?</p>
    <p-footer>
      <button
        pButton
        label="Confirmar"
        icon="pi pi-check"
        (click)="proceedWithQuote()"
        class="p-button-success confirm-btn"
      ></button>
      <button
        pButton
        label="Cancelar"
        icon="pi pi-times"
        (click)="cancelQuote()"
        class="p-button-secondary cancel-btn"
      ></button>
    </p-footer>
  </p-dialog>

  <p-toast></p-toast>
</div>
